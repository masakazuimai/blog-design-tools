<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Metal Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cell">
      <span class="cap">A: rep 0.4 / angle 0</span>
      <div class="lm" data-rep="0.4" data-ang="0">
        <div class="outline"><span class="label">BUTTON</span></div>
      </div>
    </div>
    <div class="cell">
      <span class="cap">B: rep 0.8 / angle 0</span>
      <div class="lm" data-rep="0.8" data-ang="0">
        <div class="outline"><span class="label">BUTTON</span></div>
      </div>
    </div>
    <div class="cell">
      <span class="cap">C: rep 0.4 / angle 45</span>
      <div class="lm" data-rep="0.4" data-ang="45">
        <div class="outline"><span class="label">BUTTON</span></div>
      </div>
    </div>
    <div class="cell">
      <span class="cap">D: rep 0.8 / angle 45</span>
      <div class="lm" data-rep="0.8" data-ang="45">
        <div class="outline"><span class="label">BUTTON</span></div>
      </div>
    </div>
    <div class="cell">
      <span class="cap">E: rep 1.5 / angle 90</span>
      <div class="lm" data-rep="1.5" data-ang="90">
        <div class="outline"><span class="label">BUTTON</span></div>
      </div>
    </div>
    <div class="cell">
      <span class="cap">F: rep 0.2 / angle 0</span>
      <div class="lm" data-rep="0.2" data-ang="0">
        <div class="outline"><span class="label">BUTTON</span></div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
