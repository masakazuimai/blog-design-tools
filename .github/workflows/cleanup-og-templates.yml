name: Remove OG templates from server (one-time)

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove og-*template*.html (25 files) over SSH
        env:
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT=$(echo "${REMOTE_PORT}" | tr -d '[:space:]')
          ssh-keyscan -p "${PORT}" -H "${REMOTE_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          DEST=$(echo "${REMOTE_PATH}" | tr -d '[:space:]')
          case "$DEST" in /*/*) ;; *) echo "DEPLOY_PATH が想定外: ${#DEST}文字"; exit 1 ;; esac
          ssh -p "${PORT}" "${REMOTE_USER}@${REMOTE_HOST}" "set -e; for f in "${DEST}/animated-icon-generator/assets/og-en-template.html" "${DEST}/animated-icon-generator/assets/og-template.html" "${DEST}/carousel-3d/assets/og-template-en.html" "${DEST}/carousel-3d/assets/og-template.html" "${DEST}/css-selector/assets/og-template.html" "${DEST}/gsap-animation-gallery/assets/og-en-template.html" "${DEST}/gsap-animation-gallery/assets/og-template.html" "${DEST}/hamburger-menu-gallery/assets/og-template.html" "${DEST}/handwriting-text-generator/assets/og-template-en.html" "${DEST}/handwriting-text-generator/assets/og-template.html" "${DEST}/hover-effects-gallery/assets/og-template.html" "${DEST}/image-upscaler/assets/og-en-template.html" "${DEST}/image-upscaler/assets/og-template.html" "${DEST}/liquid-metal-button/assets/og-template-en.html" "${DEST}/liquid-metal-button/assets/og-template.html" "${DEST}/page-transition-gallery/assets/og-template.html" "${DEST}/quiz-maker/assets/og-template-en.html" "${DEST}/quiz-maker/assets/og-template.html" "${DEST}/shortcut-cheatsheet/assets/og-template.html" "${DEST}/storyboard-shots/assets/og-template-en.html" "${DEST}/storyboard-shots/assets/og-template.html" "${DEST}/video-scenario-maker/assets/og-template-en.html" "${DEST}/video-scenario-maker/assets/og-template.html" "${DEST}/wireframe-patterns/assets/og-template-en.html" "${DEST}/wireframe-patterns/assets/og-template.html"; do if [ -f \"\$f\" ]; then rm -f -- \"\$f\" && echo removed: \"\$f\"; else echo absent: \"\$f\"; fi; done"
