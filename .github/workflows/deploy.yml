name: Deploy to ConoHa

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy tool directories
        run: |
          # ツールディレクトリのみ同期（README等は除外）
          for dir in */; do
            if [ -f "${dir}index.html" ]; then
              echo "Deploying: ${dir}"
              rsync -avz --chmod=D755,F644 \
                "${dir}" \
                "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/${dir}"
            fi
          done
