<!doctype html>
<!-- OG画像(1200×630)の生成元。ヘッドレスChromeでスクリーンショットして assets/og.png を作る。
     生成コマンドは同ディレクトリの README ではなくコミットメッセージ側に記録。
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --screenshot=assets/og-en.png --window-size=1200,630 --default-background-color=0 assets/og-en-template.html -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        font-family: "Noto Sans JP", sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #3730a3 58%, #6d28d9 100%);
        color: #fff;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 78px;
      }

      /* 背景: モーションの軌跡を思わせる同心の弧 */
      .arc {
        position: absolute;
        border: 2px solid rgba(199, 210, 254, 0.16);
        border-radius: 50%;
      }
      .arc-1 { width: 720px; height: 720px; right: -190px; top: -150px; }
      .arc-2 { width: 980px; height: 980px; right: -320px; top: -280px; }
      .arc-3 { width: 460px; height: 460px; right: -60px; top: -20px; border-color: rgba(236, 72, 153, 0.28); }

      /* 背景: イージング曲線 */
      .curve { position: absolute; right: 60px; bottom: 46px; opacity: 0.9; }

      .badge {
        display: inline-block;
        align-self: flex-start;
        border: 1px solid rgba(165, 180, 252, 0.55);
        background: rgba(99, 102, 241, 0.2);
        color: #c7d2fe;
        border-radius: 999px;
        padding: 8px 24px;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 26px;
      }
      h1 {
        font-size: 78px;
        font-weight: 900;
        line-height: 1.18;
        letter-spacing: -0.035em;
        position: relative;
        z-index: 2;
      }
      h1 .num {
        background: linear-gradient(90deg, #a5b4fc, #f9a8d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tags {
        display: flex;
        gap: 12px;
        margin-top: 30px;
        position: relative;
        z-index: 2;
      }
      .tag {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 25px;
        font-weight: 500;
      }
      .site {
        position: absolute;
        left: 78px;
        bottom: 44px;
        font-size: 26px;
        font-weight: 700;
        color: #a5b4fc;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="arc arc-1"></div>
    <div class="arc arc-2"></div>
    <div class="arc arc-3"></div>

    <svg class="curve" width="260" height="150" viewBox="0 0 260 150" fill="none">
      <path d="M6 144 C 96 144, 120 12, 254 8" stroke="#f9a8d4" stroke-width="5" stroke-linecap="round" />
      <circle cx="6" cy="144" r="9" fill="#a5b4fc" />
      <circle cx="254" cy="8" r="9" fill="#f9a8d4" />
    </svg>

    <span class="badge">GSAP / ScrollTrigger</span>
    <h1>100 GSAP<br />Animation <span class="num">Examples</span></h1>
    <div class="tags">
      <span class="tag">ScrollTrigger</span>
      <span class="tag">Timeline</span>
      <span class="tag">Split text</span>
      <span class="tag">Copy &amp; paste</span>
    </div>
    <span class="site">CodeQuest.work</span>
  </body>
</html>
