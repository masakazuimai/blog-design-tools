    /* 見出しスタイル（WPブロックエディタでは再現困難なもの） */
    .style-marker h2 {
      background: linear-gradient(transparent 60%, #fef08a 60%);
      font-size: 1.5rem;
      display: inline;
      padding: 0 4px;
    }

    .style-gradient-underline h2 {
      border-bottom: 3px solid transparent;
      border-image: linear-gradient(90deg, #3b82f6, #8b5cf6) 1;
      padding-bottom: 8px;
      font-size: 1.5rem;
    }

    .style-ribbon h2 {
      background: #3b82f6;
      color: #fff;
      padding: 8px 20px 8px 16px;
      font-size: 1.5rem;
      display: inline-block;
      border-radius: 0 4px 4px 0;
      box-shadow: -4px 0 0 #1e3a8a;
    }

    .style-stripe h2 {
      background: repeating-linear-gradient(
        -45deg,
        #eff6ff,
        #eff6ff 4px,
        #dbeafe 4px,
        #dbeafe 8px
      );
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 1.5rem;
    }

    .style-double-accent h2 {
      font-size: 1.5rem;
      padding: 10px 16px;
      border-left: 4px solid #3b82f6;
      border-bottom: 2px solid #3b82f6;
      background: linear-gradient(135deg, #eff6ff 0%, transparent 60%);
    }

    .style-clip-step h2 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: #fff;
      padding: 12px 20px 12px 24px;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
    }

    .style-bracket h2 {
      font-size: 1.5rem;
      text-align: center;
      position: relative;
      padding: 8px 24px;
    }

    .style-bracket h2::before,
    .style-bracket h2::after {
      content: '';
      position: absolute;
      top: 0;
      width: 16px;
      height: 100%;
      border: 2px solid #3b82f6;
    }

    .style-bracket h2::before {
      left: 0;
      border-right: none;
    }

    .style-bracket h2::after {
      right: 0;
      border-left: none;
    }

    /* アニメーション付きスタイル */
    .style-hover-underline h2 {
      font-size: 1.5rem;
      position: relative;
      display: inline-block;
      padding-bottom: 6px;
    }

    .style-hover-underline h2::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      transition: width 0.3s ease;
    }

    .style-hover-underline h2:hover::after {
      width: 100%;
    }

    .style-hover-bg h2 {
      font-size: 1.5rem;
      padding: 12px 16px;
      border-radius: 6px;
      position: relative;
      z-index: 1;
      transition: color 0.3s ease;
    }

    .style-hover-bg h2::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #3b82f6;
      border-radius: 6px;
      z-index: -1;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .style-hover-bg h2:hover {
      color: #fff;
    }

    .style-hover-bg h2:hover::before {
      transform: scaleX(1);
    }

    .style-gradient-flow h2 {
      font-size: 1.5rem;
      padding: 12px 16px;
      border-radius: 6px;
      background: linear-gradient(90deg, #eff6ff, #ede9fe, #fce7f3, #eff6ff);
      background-size: 300% 100%;
      animation: gradientFlow 4s ease infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .style-typing h2 {
      font-size: 1.5rem;
      border-right: 3px solid #3b82f6;
      display: inline;
      width: auto;
      padding-right: 4px;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .style-bounce-border h2 {
      font-size: 1.5rem;
      padding-bottom: 10px;
      position: relative;
    }

    .style-bounce-border h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 60px;
      height: 3px;
      background: #3b82f6;
      border-radius: 2px;
      animation: bounceLine 2s ease-in-out infinite;
    }

    @keyframes bounceLine {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(40px); }
    }

    .style-glow h2 {
      font-size: 1.5rem;
      color: #1e40af;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 2px rgba(59, 130, 246, 0.3); }
      to { text-shadow: 0 0 12px rgba(59, 130, 246, 0.6), 0 0 24px rgba(59, 130, 246, 0.2); }
    }

    .style-border-draw h2 {
      font-size: 1.5rem;
      padding: 12px 16px;
      position: relative;
    }

    .style-border-draw h2::before,
    .style-border-draw h2::after {
      content: '';
      position: absolute;
      border: 2px solid transparent;
    }

    .style-border-draw h2::before {
      top: 0;
      left: 0;
      border-top-color: #3b82f6;
      border-left-color: #3b82f6;
      animation: borderDrawIn 2s ease infinite alternate;
    }

    .style-border-draw h2::after {
      bottom: 0;
      right: 0;
      border-bottom-color: #3b82f6;
      border-right-color: #3b82f6;
      animation: borderDrawIn 2s ease 0.3s infinite alternate;
    }

    @keyframes borderDrawIn {
      0% { width: 0; height: 0; }
      50% { width: 100%; height: 0; }
      100% { width: 100%; height: 100%; }
    }

    footer {

      {
        name: "枠線ドロー",
        className: "style-border-draw",
        category: "アニメーション",
        css: "font-size: 1.5rem;\nfont-weight: bold;\npadding: 12px 16px;\nposition: relative;",
        pseudoBefore: "content: '';\nposition: absolute;\ntop: 0;\nleft: 0;\nborder: 2px solid transparent;\nborder-top-color: #3b82f6;\nborder-left-color: #3b82f6;\nanimation: borderDrawIn 2s ease infinite alternate;",
        pseudoAfter: "content: '';\nposition: absolute;\nbottom: 0;\nright: 0;\nborder: 2px solid transparent;\nborder-bottom-color: #3b82f6;\nborder-right-color: #3b82f6;\nanimation: borderDrawIn 2s ease 0.3s infinite alternate;",
        keyframes: "@keyframes borderDrawIn {\n  0% { width: 0; height: 0; }\n  50% { width: 100%; height: 0; }\n  100% { width: 100%; height: 100%; }\n}"
      }
    ];

    const input = document.getElementById("preview-text");
    const tagSelect = document.getElementById("tag-select");
    const cardsContainer = document.getElementById("cards");

    function needsFullCode(design) {
      return design.keyframes || design.pseudoAfter || design.pseudoBefore || design.pseudoHoverSelf;
    }

    function getHtml(design, text, tag) {
      if (needsFullCode(design)) {
        return getFullCode(design, text, tag);
      }
      return `<${tag} style="${design.css.replace(/\n/g, ' ')}">${text}</${tag}>`;
    }

    function getFullCode(design, text, tag) {
      const className = `heading-${design.className.replace('style-', '')}`;
      let style = `.${className} {\n  ${design.css.replace(/\n/g, '\n  ')}\n}`;

      if (design.pseudoBefore) {
        style += `\n\n.${className}::before {\n  ${design.pseudoBefore.replace(/\n/g, '\n  ')}\n}`;
      }
      if (design.pseudoAfter) {
        style += `\n\n.${className}::after {\n  ${design.pseudoAfter.replace(/\n/g, '\n  ')}\n}`;
      }
      if (design.pseudoHover) {
        style += `\n\n.${className}:hover::after {\n  ${design.pseudoHover.replace(/\n/g, '\n  ')}\n}`;
      }
      if (design.pseudoHoverSelf) {
        style += `\n\n.${className}:hover {\n  ${design.pseudoHoverSelf.replace(/\n/g, '\n  ')}\n}`;
      }
      if (design.pseudoHoverBefore) {
        style += `\n\n.${className}:hover::before {\n  ${design.pseudoHoverBefore.replace(/\n/g, '\n  ')}\n}`;
      }
      if (design.keyframes) {
        style += `\n\n${design.keyframes}`;
      }

      return `<style>\n${style}\n</style>\n<${tag} class="${className}">${text}</${tag}>`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function render() {
      const text = input.value || "ブログの見出しサンプル";
      const tag = tagSelect.value;

      cardsContainer.innerHTML = designs.map((d, i) => {
        const htmlInline = getHtml(d, text, tag);
        const fullCode = getFullCode(d, text, tag);

        const badge = d.category === "アニメーション" ? '<span class="badge-anim">CSS Animation</span>' : '';
        return `
        <div class="card">
          <div class="card-header">
            <span class="card-name">${d.name}${badge}</span>
            <div class="btn-group">
              <button class="copy-btn" data-type="full" data-index="${i}">HTML+CSS</button>
              ${!needsFullCode(d) ? `<button class="copy-btn" data-type="inline" data-index="${i}">インライン</button>` : ''}
            </div>
          </div>
          <div class="preview ${d.className}">
            <h2>${text}</h2>
          </div>
          <div class="card-footer">
            <button class="toggle-btn" data-target="code-${i}">コードを表示</button>
          </div>
          <div class="code-panel" id="code-${i}">
            <div class="code-tabs">
              <button class="code-tab active" data-panel="code-${i}" data-tab="full">HTML+CSS${needsFullCode(d) ? '' : '（推奨）'}</button>
              ${!needsFullCode(d) ? `<button class="code-tab" data-panel="code-${i}" data-tab="inline">インラインスタイル</button>` : ''}
            </div>
            <pre class="code-block active" data-panel="code-${i}" data-content="full">${escapeHtml(fullCode)}</pre>
            ${!needsFullCode(d) ? `<pre class="code-block" data-panel="code-${i}" data-content="inline">${escapeHtml(htmlInline)}</pre>` : ''}
          </div>
        </div>`;
      }).join("");
    }

    input.addEventListener("input", render);
    tagSelect.addEventListener("change", render);
    render();

    cardsContainer.addEventListener("click", async (e) => {
      const copyBtn = e.target.closest(".copy-btn");
      if (copyBtn) {
        const index = parseInt(copyBtn.dataset.index);
        const type = copyBtn.dataset.type;
        const text = input.value || "ブログの見出しサンプル";
        const tag = tagSelect.value;
        const d = designs[index];
        const code = type === "full" ? getFullCode(d, text, tag) : getHtml(d, text, tag);

        await navigator.clipboard.writeText(code);
        const original = copyBtn.textContent;
        copyBtn.textContent = "コピー完了！";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = original;
          copyBtn.classList.remove("copied");
        }, 1500);
        return;
      }

      const toggleBtn = e.target.closest(".toggle-btn");
      if (toggleBtn) {
        const panel = document.getElementById(toggleBtn.dataset.target);
        const isOpen = panel.classList.toggle("open");
        toggleBtn.textContent = isOpen ? "コードを閉じる" : "コードを表示";
        return;
      }

      const codeTab = e.target.closest(".code-tab");
      if (codeTab) {
        const panelId = codeTab.dataset.panel;
        const tabName = codeTab.dataset.tab;

        document.querySelectorAll(`.code-tab[data-panel="${panelId}"]`).forEach(t => t.classList.remove("active"));
        document.querySelectorAll(`.code-block[data-panel="${panelId}"]`).forEach(b => b.classList.remove("active"));

        codeTab.classList.add("active");
        document.querySelector(`.code-block[data-panel="${panelId}"][data-content="${tabName}"]`).classList.add("active");
      }
    });
  </script>
</body>
</html>
