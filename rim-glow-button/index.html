<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rim Glow Button — リムの光ジェネレーター</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <!-- 縁(リム)が光るボタン。中身はscript.jsが光パターンに応じて再構築する -->
      <button class="rim-btn" type="button">
        <svg class="rim-btn__svg" viewBox="0 0 320 120" width="320" height="120" aria-hidden="true"></svg>
        <span class="rim-btn__label">BUTTON</span>
      </button>

      <!-- コントロールパネル（各入力がstateに連動） -->
      <div class="panel">
        <div class="field field--wide">
          <div class="field__head">
            <label for="pattern">光パターン</label>
          </div>
          <select class="field__text field__select" id="pattern" data-key="pattern">
            <option value="distant">方向ライト（片側スイープ）</option>
            <option value="point">ポイント（一点が強く光る）</option>
            <option value="spot">スポット（鋭い集光）</option>
            <option value="neon">ネオン（均一発光）</option>
            <option value="dual">デュアル（両側・2色）</option>
          </select>
        </div>

        <div class="field field--wide">
          <div class="field__head">
            <label for="label">ボタンテキスト</label>
          </div>
          <input class="field__text" id="label" type="text" value="BUTTON" maxlength="24" data-key="label" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="width">ボタン幅</label>
            <span class="field__value" data-out="width">320px</span>
          </div>
          <input class="field__slider" id="width" type="range" min="160" max="560" step="4" value="320"
            data-key="width" data-unit="px" />
        </div>

        <!-- 方向/デュアル：光源の向き -->
        <div class="field" data-pattern="distant dual">
          <div class="field__head">
            <label for="azimuth">光源角度</label>
            <span class="field__value" data-out="azimuth">135°</span>
          </div>
          <input class="field__slider" id="azimuth" type="range" min="0" max="360" step="1" value="135"
            data-key="azimuth" data-unit="°" data-round="1" />
        </div>

        <div class="field" data-pattern="distant dual">
          <div class="field__head">
            <label for="elevation">光源高度</label>
            <span class="field__value" data-out="elevation">46°</span>
          </div>
          <input class="field__slider" id="elevation" type="range" min="0" max="90" step="1" value="46"
            data-key="elevation" data-unit="°" />
        </div>

        <!-- ポイント/スポット：光源位置 -->
        <div class="field" data-pattern="point spot">
          <div class="field__head">
            <label for="pointX">光源位置X</label>
            <span class="field__value" data-out="pointXPct">50%</span>
          </div>
          <input class="field__slider" id="pointX" type="range" min="0" max="100" step="1" value="50"
            data-key="pointXPct" data-unit="%" />
        </div>

        <div class="field" data-pattern="point spot">
          <div class="field__head">
            <label for="pointY">光源位置Y</label>
            <span class="field__value" data-out="pointYPct">0%</span>
          </div>
          <input class="field__slider" id="pointY" type="range" min="0" max="100" step="1" value="0"
            data-key="pointYPct" data-unit="%" />
        </div>

        <div class="field" data-pattern="point">
          <div class="field__head">
            <label for="pointZ">光の広がり</label>
            <span class="field__value" data-out="pointZ">14</span>
          </div>
          <input class="field__slider" id="pointZ" type="range" min="1" max="100" step="1" value="14"
            data-key="pointZ" />
        </div>

        <!-- スポット：光源の高さ・コーン角 -->
        <div class="field" data-pattern="spot">
          <div class="field__head">
            <label for="spotZ">光源の高さ</label>
            <span class="field__value" data-out="spotZ">40</span>
          </div>
          <input class="field__slider" id="spotZ" type="range" min="1" max="100" step="1" value="40"
            data-key="spotZ" />
        </div>

        <div class="field" data-pattern="spot">
          <div class="field__head">
            <label for="cone">コーン角</label>
            <span class="field__value" data-out="coneAngle">40°</span>
          </div>
          <input class="field__slider" id="cone" type="range" min="1" max="90" step="1" value="40"
            data-key="coneAngle" data-unit="°" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="thickness">リムの太さ</label>
            <span class="field__value" data-out="thickness">14</span>
          </div>
          <input class="field__slider" id="thickness" type="range" min="1" max="40" step="1" value="14"
            data-key="thickness" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="radius">角丸</label>
            <span class="field__value" data-out="radius">46</span>
          </div>
          <input class="field__slider" id="radius" type="range" min="0" max="46" step="1" value="46"
            data-key="radius" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="blur">滲み（ぼかし）</label>
            <span class="field__value" data-out="blur">3</span>
          </div>
          <input class="field__slider" id="blur" type="range" min="0" max="15" step="0.5" value="3"
            data-key="blur" />
        </div>

        <!-- specular系（方向/スポット/デュアルのみ。ポイント=グラデ方式・ネオン=光源なしは対象外）-->
        <div class="field" data-pattern="distant spot dual">
          <div class="field__head">
            <label for="surface">立体感</label>
            <span class="field__value" data-out="surfaceScale">8</span>
          </div>
          <input class="field__slider" id="surface" type="range" min="0" max="30" step="1" value="8"
            data-key="surfaceScale" />
        </div>

        <div class="field" data-pattern="distant spot dual">
          <div class="field__head">
            <label for="exponent">光の鋭さ</label>
            <span class="field__value" data-out="exponent">70</span>
          </div>
          <input class="field__slider" id="exponent" type="range" min="1" max="120" step="1" value="70"
            data-key="exponent" />
        </div>

        <div class="field" data-pattern="distant spot dual">
          <div class="field__head">
            <label for="constant">光の強さ</label>
            <span class="field__value" data-out="constant">1.2</span>
          </div>
          <input class="field__slider" id="constant" type="range" min="0" max="3" step="0.1" value="1.2"
            data-key="constant" />
        </div>

        <!-- 方向/ポイント/スポット：リムの色 -->
        <div class="field" data-pattern="distant point spot">
          <div class="field__head">
            <label for="color">リムの色</label>
          </div>
          <input class="field__color" id="color" type="color" value="#ffffff" data-key="lightColor" />
        </div>

        <!-- ネオン：グロー色・強度 -->
        <div class="field" data-pattern="neon">
          <div class="field__head">
            <label for="glowColor">グロー色</label>
          </div>
          <input class="field__color" id="glowColor" type="color" value="#00ffaa" data-key="glowColor" />
        </div>

        <div class="field" data-pattern="neon">
          <div class="field__head">
            <label for="glowIntensity">グロー強度</label>
            <span class="field__value" data-out="glowIntensity">0.3</span>
          </div>
          <input class="field__slider" id="glowIntensity" type="range" min="0" max="1" step="0.05" value="0.3"
            data-key="glowIntensity" />
        </div>

        <!-- デュアル：左右の色 -->
        <div class="field" data-pattern="dual">
          <div class="field__head">
            <label for="leftColor">左の色</label>
          </div>
          <input class="field__color" id="leftColor" type="color" value="#22d3ee" data-key="leftColor" />
        </div>

        <div class="field" data-pattern="dual">
          <div class="field__head">
            <label for="rightColor">右の色</label>
          </div>
          <input class="field__color" id="rightColor" type="color" value="#f472b6" data-key="rightColor" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="fillColor">ボタンの色</label>
          </div>
          <input class="field__color" id="fillColor" type="color" value="#11141b" data-key="fillColor" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="fillOpacity">ボタンの濃さ</label>
            <span class="field__value" data-out="fillOpacity">0</span>
          </div>
          <input class="field__slider" id="fillOpacity" type="range" min="0" max="1" step="0.05" value="0"
            data-key="fillOpacity" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="speed">回転速度</label>
            <span class="field__value" data-out="speed">1</span>
          </div>
          <input class="field__slider" id="speed" type="range" min="0.1" max="4" step="0.1" value="1"
            data-key="speed" />
        </div>

        <div class="panel__actions">
          <button class="btn" id="spin" type="button" aria-pressed="false">自動回転：OFF</button>
          <button class="btn" id="reset" type="button">リセット</button>
        </div>
      </div>

      <!-- 生成コード出力（各設定値に連動して更新される貼り付け用コード） -->
      <div class="output">
        <div class="output__col">
          <div class="output__head">
            <h2>HTML</h2>
            <button class="btn" id="copyHtml" type="button">HTMLをコピー</button>
          </div>
          <textarea class="output__code" id="outHtml" readonly spellcheck="false"></textarea>
        </div>
        <div class="output__col">
          <div class="output__head">
            <h2>CSS</h2>
            <button class="btn" id="copyCss" type="button">CSSをコピー</button>
          </div>
          <textarea class="output__code" id="outCss" readonly spellcheck="false"></textarea>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
