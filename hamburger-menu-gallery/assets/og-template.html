<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* OG画像テンプレート（1200×630）。ヘッドレスChromeでPNG化する */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #3730a3 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 90px;
        position: relative;
        overflow: hidden;
      }
      .badge {
        display: inline-block;
        align-self: flex-start;
        background: rgba(147, 197, 253, 0.18);
        border: 2px solid rgba(147, 197, 253, 0.5);
        color: #bfdbfe;
        font-size: 30px;
        font-weight: 700;
        padding: 10px 28px;
        border-radius: 999px;
        margin-bottom: 34px;
      }
      h1 {
        font-size: 72px;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      h1 .accent { color: #a5b4fc; }
      .sub {
        margin-top: 28px;
        font-size: 34px;
        color: #c7d2fe;
        font-weight: 600;
      }
      /* 右下：3本線 → × への変化を4コマで見せる */
      .samples {
        position: absolute;
        right: 78px;
        bottom: 48px;
        display: flex;
        gap: 30px;
        align-items: center;
      }
      .icon { position: relative; width: 64px; height: 64px; }
      .icon i {
        position: absolute; left: 12px; top: 50%; width: 40px; height: 4px; margin-top: -2px;
        background: #a5b4fc; border-radius: 3px;
      }
      .icon i:nth-child(1) { transform: translateY(-12px); }
      .icon i:nth-child(3) { transform: translateY(12px); }
      .i2 i:nth-child(1) { transform: translateY(-6px) rotate(12deg); }
      .i2 i:nth-child(3) { transform: translateY(6px) rotate(-12deg); }
      .i3 i:nth-child(1) { transform: rotate(30deg); }
      .i3 i:nth-child(2) { opacity: 0.3; }
      .i3 i:nth-child(3) { transform: rotate(-30deg); }
      .i4 i { background: #f9a8d4; }
      .i4 i:nth-child(1) { transform: rotate(45deg); }
      .i4 i:nth-child(2) { opacity: 0; }
      .i4 i:nth-child(3) { transform: rotate(-45deg); }
      .brand {
        position: absolute;
        left: 90px;
        bottom: 54px;
        font-size: 30px;
        color: #93c5fd;
        font-weight: 700;
      }
      .deco {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99,102,241,0.5), transparent 70%);
      }
      .deco1 { width: 500px; height: 500px; right: -140px; top: -200px; }
      .deco2 { width: 380px; height: 380px; left: -120px; bottom: -180px; background: radial-gradient(circle, rgba(236,72,153,0.35), transparent 70%); }
    </style>
  </head>
  <body>
    <div class="deco deco1"></div>
    <div class="deco deco2"></div>
    <div class="badge">コピペOK・ライブラリ不要・無料</div>
    <h1>ハンバーガーメニュー<br /><span class="accent">CSS 90選</span> ギャラリー</h1>
    <div class="sub">アイコン変形60種 ＋ 開閉アニメーション30種</div>
    <div class="samples">
      <span class="icon i1"><i></i><i></i><i></i></span>
      <span class="icon i2"><i></i><i></i><i></i></span>
      <span class="icon i3"><i></i><i></i><i></i></span>
      <span class="icon i4"><i></i><i></i><i></i></span>
    </div>
    <div class="brand">CodeQuest.work</div>
  </body>
</html>
