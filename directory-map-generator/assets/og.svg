<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f0f1f3" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- kicker -->
  <text x="82" y="140" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="30" fill="#737373">~/directory-map</text>
  <!-- title -->
  <text x="80" y="218" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="62" font-weight="700" fill="#0a0a0a" letter-spacing="-2">ディレクトリマップ作成ツール</text>
  <!-- subtitle -->
  <text x="82" y="272" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28" fill="#4d4d4d">フォルダ・ファイルを矢印でつないで作る、無料のディレクトリマップ／サイト構成図ツール</text>

  <!-- ASCII directory tree card -->
  <rect x="340" y="330" width="520" height="238" rx="16" fill="#fafafa" stroke="#e5e5e5" />
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="28">
    <text x="378" y="384" fill="#0a0a0a">my-app/</text>
    <text x="378" y="422" fill="#9aa0a6">├─ <tspan fill="#0a0a0a">src/</tspan></text>
    <text x="378" y="460" fill="#9aa0a6">│&#160;&#160;├─ <tspan fill="#0a0a0a">index.tsx</tspan></text>
    <text x="378" y="498" fill="#9aa0a6">│&#160;&#160;└─ <tspan fill="#0a0a0a">Button.tsx</tspan></text>
    <text x="378" y="536" fill="#9aa0a6">├─ <tspan fill="#0a0a0a">public/</tspan></text>
    <text x="378" y="574" fill="#9aa0a6">└─ <tspan fill="#0a0a0a">package.json</tspan></text>
  </g>

  <!-- brand -->
  <text x="1120" y="600" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" fill="#737373">CodeQuest.work</text>
</svg>
