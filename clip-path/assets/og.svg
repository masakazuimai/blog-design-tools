<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.6" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0f172a"/>
      <rect width="20" height="20" fill="#1e293b"/>
      <rect x="20" y="20" width="20" height="20" fill="#1e293b"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 右側：クリップされた図形のプレビュー（チェッカー背景＋多角形＋頂点ハンドル） -->
  <g transform="translate(770,135)">
    <rect width="360" height="360" rx="20" fill="url(#checker)" opacity="0.9"/>
    <!-- 六角形でクリップした図形 -->
    <polygon points="180,16 324,98 324,262 180,344 36,262 36,98" fill="url(#shape)"/>
    <!-- 頂点ハンドル -->
    <g fill="#ffffff" stroke="#3b82f6" stroke-width="4">
      <circle cx="180" cy="16" r="11"/>
      <circle cx="324" cy="98" r="11"/>
      <circle cx="324" cy="262" r="11"/>
      <circle cx="180" cy="344" r="11"/>
      <circle cx="36" cy="262" r="11"/>
      <circle cx="36" cy="98" r="11"/>
    </g>
  </g>

  <!-- 左側：テキスト -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="190" height="42" rx="21" fill="#3b82f6"/>
    <text x="95" y="29" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">無料ツール</text>

    <text x="0" y="135" fill="#ffffff" font-size="74" font-weight="700" letter-spacing="-2">clip-path</text>
    <text x="0" y="215" fill="#60a5fa" font-size="60" font-weight="700" letter-spacing="-1">ジェネレーター</text>

    <text x="2" y="285" fill="#cbd5e1" font-size="27" font-weight="500">CSSの切り抜き・図形をドラッグで作成</text>
    <text x="2" y="325" fill="#cbd5e1" font-size="27" font-weight="500">-webkit- 付きコードをワンクリックでコピー</text>
  </g>

  <!-- フッターのブランド -->
  <text x="90" y="560" fill="#94a3b8" font-size="24" font-weight="500">CodeQuest.work</text>
  <text x="90" y="595" fill="#64748b" font-size="19">polygon / circle / ellipse / inset 対応</text>
</svg>
