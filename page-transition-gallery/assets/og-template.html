<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* OG画像テンプレート（1200×630）。ヘッドレスChromeでPNG化する */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #3730a3 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 90px;
        position: relative;
        overflow: hidden;
      }
      .badge {
        display: inline-block;
        align-self: flex-start;
        background: rgba(147, 197, 253, 0.18);
        border: 2px solid rgba(147, 197, 253, 0.5);
        color: #bfdbfe;
        font-size: 30px;
        font-weight: 700;
        padding: 10px 28px;
        border-radius: 999px;
        margin-bottom: 34px;
      }
      h1 {
        font-size: 68px;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      h1 .accent { color: #a5b4fc; }
      .sub {
        margin-top: 28px;
        font-size: 34px;
        color: #c7d2fe;
        font-weight: 600;
      }
      /* 右下：幕が開いていく様子を4コマで見せる */
      .samples {
        position: absolute;
        right: 78px;
        bottom: 52px;
        display: flex;
        gap: 18px;
      }
      .frame {
        position: relative;
        width: 92px;
        height: 62px;
        border-radius: 8px;
        overflow: hidden;
        background: #f1f5f9;
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .frame i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: #a5b4fc;
      }
      .frame i:nth-child(1) { left: 0; }
      .frame i:nth-child(2) { right: 0; }
      .f2 i:nth-child(1) { transform: translateX(-40%); }
      .f2 i:nth-child(2) { transform: translateX(40%); }
      .f3 i:nth-child(1) { transform: translateX(-75%); }
      .f3 i:nth-child(2) { transform: translateX(75%); }
      .f4 i { background: #f9a8d4; }
      .f4 i:nth-child(1) { transform: translateX(-100%); }
      .f4 i:nth-child(2) { transform: translateX(100%); }
      .brand {
        position: absolute;
        left: 90px;
        bottom: 54px;
        font-size: 30px;
        color: #93c5fd;
        font-weight: 700;
      }
      .deco {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99,102,241,0.5), transparent 70%);
      }
      .deco1 { width: 500px; height: 500px; right: -140px; top: -200px; }
      .deco2 { width: 380px; height: 380px; left: -120px; bottom: -180px; background: radial-gradient(circle, rgba(236,72,153,0.35), transparent 70%); }
    </style>
  </head>
  <body>
    <div class="deco deco1"></div>
    <div class="deco deco2"></div>
    <div class="badge">コピペOK・ライブラリ不要・無料</div>
    <h1>ページ遷移アニメーション<br /><span class="accent">CSS 42選</span></h1>
    <div class="sub">カーテン20種 ＋ 遷移演出10種 ＋ ローディング12種</div>
    <div class="samples">
      <span class="frame f1"><i></i><i></i></span>
      <span class="frame f2"><i></i><i></i></span>
      <span class="frame f3"><i></i><i></i></span>
      <span class="frame f4"><i></i><i></i></span>
    </div>
    <div class="brand">CodeQuest.work</div>
  </body>
</html>
