<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0a0a0a; color: #ededed; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; padding: 0 80px; gap: 64px; }
  .left { flex: 1; }
  .badge { display: inline-block; color: #6ea8fe; border: 2px solid #2e2e2e; border-radius: 40px; padding: 6px 22px; font-size: 26px; font-weight: 700; margin-bottom: 28px; }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
  p { margin-top: 24px; font-size: 30px; color: #9a9a9a; line-height: 1.5; }
  .site { margin-top: 36px; font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #6ea8fe; }
  .card { width: 400px; background: #141414; border: 2px solid #2e2e2e; border-radius: 20px; padding: 28px; }
  .q { font-size: 24px; font-weight: 700; margin-bottom: 18px; }
  .c { display: flex; gap: 14px; align-items: center; background: #1a1a1a; border: 2px solid #2e2e2e; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; font-size: 22px; }
  .c b { font-family: 'JetBrains Mono', monospace; color: #888; }
  .c.ok { border-color: #00ac5c; background: rgba(0,172,92,.15); }
  .lv { margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #6ea8fe; }
</style>
</head>
<body>
  <div class="left">
    <span class="badge">無料・登録不要</span>
    <h1>自分だけの<br>問題集</h1>
    <p>4択問題を作って、覚えるまで出題。<br>問題と学習記録はPCのファイルに保存。</p>
    <div class="site">CodeQuest.work</div>
  </div>
  <div class="card">
    <div class="q">光の三原色に含まれない色は？</div>
    <div class="c"><b>1</b>赤</div>
    <div class="c ok"><b>2</b>黄</div>
    <div class="c"><b>3</b>緑</div>
    <div class="c"><b>4</b>青</div>
    <div class="lv">Lv2 → Lv3（次回は1週間後）</div>
  </div>
</body>
</html>
