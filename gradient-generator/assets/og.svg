<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="wa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7282e"/>
      <stop offset="0.5" stop-color="#e8743b"/>
      <stop offset="1" stop-color="#f6d8a8"/>
    </linearGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcd6ec"/>
      <stop offset="1" stop-color="#a59aca"/>
    </linearGradient>
    <linearGradient id="gunjo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6cb3"/>
      <stop offset="1" stop-color="#16161d"/>
    </linearGradient>
    <style>
      .serif { font-family: "Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif; }
      .mono { font-family: "JetBrains Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f4efe3"/>

  <!-- 落款風ドット -->
  <circle cx="80" cy="86" r="15" fill="#b14730"/>
  <text x="112" y="92" class="serif" font-size="24" letter-spacing="6" fill="#a79d8a">GRADIENT GENERATOR</text>

  <!-- タイトル -->
  <text x="80" y="232" class="serif" font-size="86" font-weight="600" fill="#23201a">グラデーション</text>
  <text x="80" y="338" class="serif" font-size="86" font-weight="600" fill="#b14730">ジェネレーター</text>

  <text x="82" y="404" class="serif" font-size="30" fill="#6f6757">CSS / Tailwind ・ 線形・放射・扇形 ・ 和グラデーション</text>

  <!-- グラデーション標本 -->
  <g>
    <rect x="80" y="452" width="320" height="104" rx="6" fill="url(#wa)" stroke="#e3dbc8"/>
    <rect x="420" y="452" width="320" height="104" rx="6" fill="url(#fuji)" stroke="#e3dbc8"/>
    <rect x="760" y="452" width="320" height="104" rx="6" fill="url(#gunjo)" stroke="#e3dbc8"/>
    <text x="84" y="582" class="mono" font-size="20" fill="#6f6757">茜の空</text>
    <text x="424" y="582" class="mono" font-size="20" fill="#6f6757">藤浪</text>
    <text x="764" y="582" class="mono" font-size="20" fill="#6f6757">群青の夜</text>
  </g>

  <text x="1120" y="92" text-anchor="end" class="serif" font-size="22" fill="#a79d8a">CodeQuest.work</text>
</svg>
