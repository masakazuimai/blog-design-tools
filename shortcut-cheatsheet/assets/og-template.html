<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #15161a; }
      .og {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: radial-gradient(1100px 700px at 78% -10%, rgba(49,168,255,0.18), transparent 60%), #1b1d22;
        font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        color: #e8eaed;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .accent-bar {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 14px;
        background: var(--c, #31a8ff);
      }
      .eyebrow {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #9aa0a6;
        margin-bottom: 20px;
      }
      .app {
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.02;
      }
      .app .accent { color: var(--c, #31a8ff); }
      .title {
        font-size: 40px;
        font-weight: 800;
        margin-top: 10px;
        letter-spacing: -0.01em;
      }
      .sub {
        font-size: 26px;
        color: #aab0b6;
        margin-top: 18px;
      }
      .keys {
        display: flex;
        gap: 12px;
        margin-top: 44px;
      }
      .key {
        min-width: 64px;
        height: 64px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2a2c30;
        border: 1px solid #3c3f45;
        border-bottom-width: 4px;
        border-radius: 12px;
        font-size: 30px;
        font-weight: 800;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      .key.on { border-color: var(--c, #31a8ff); color: var(--c, #31a8ff); }
      .brand {
        position: absolute;
        left: 80px;
        bottom: 56px;
        font-size: 24px;
        font-weight: 700;
        color: #8b9096;
      }
      .brand b { color: #e8eaed; }
    </style>
  </head>
  <body>
    <div class="og" id="og">
      <span class="accent-bar"></span>
      <div class="eyebrow">ショートカットキー チートシート</div>
      <div class="app" id="app">Photoshop</div>
      <div class="sub" id="sub">画像編集・レタッチ</div>
      <div class="keys">
        <span class="key on">⌘</span>
        <span class="key">⇧</span>
        <span class="key">⌥</span>
        <span class="key on" id="letter">P</span>
      </div>
      <div class="brand"><b>CodeQuest.work</b> / shortcut-cheatsheet</div>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const app = q.get("app") || "Photoshop";
      const sub = q.get("sub") || "";
      const color = q.get("color") || "#31a8ff";
      const letter = q.get("letter") || app[0];
      document.documentElement.style.setProperty("--c", color);
      document.getElementById("og").style.setProperty("--c", color);
      document.getElementById("app").textContent = app;
      document.getElementById("sub").textContent = sub;
      document.getElementById("letter").textContent = letter;
      document.title = app + " OG";
    </script>
  </body>
</html>
