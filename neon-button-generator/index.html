  <body>
    <header>
      <div class="brand"><span>Neon Button</span> Generator</div>
      <a class="lang-switch" href="en/" hreflang="en">English</a>
    </header>

    <main class="stage">
      <!-- 縁(リム)が光るボタン。スクロールしても見えるよう上部に固定。中身はscript.jsが光パターンに応じて再構築する -->
      <div class="preview">
        <button class="rim-btn" type="button">
          <svg class="rim-btn__svg" viewBox="0 0 320 120" width="320" height="120" aria-hidden="true"></svg>
          <span class="rim-btn__label">BUTTON</span>
        </button>
      </div>

      <!-- 光パターン選択（ボタン）。設定パネルの上の独立セクション -->
      <section class="patterns">
        <h2 class="patterns__title">光パターン</h2>
        <div class="patterns__grid">
          <button class="pattern-btn is-active" type="button" data-pattern-btn="distant">方向ライト</button>
          <button class="pattern-btn" type="button" data-pattern-btn="point">ポイント</button>
          <button class="pattern-btn" type="button" data-pattern-btn="arcshine">アークシャイン</button>
          <button class="pattern-btn" type="button" data-pattern-btn="beamglow">ビームグロー</button>
          <button class="pattern-btn" type="button" data-pattern-btn="glossshine">グロスシャイン</button>
          <button class="pattern-btn" type="button" data-pattern-btn="neon">ネオン</button>
          <button class="pattern-btn" type="button" data-pattern-btn="dual">デュアル</button>
          <button class="pattern-btn" type="button" data-pattern-btn="gradient">グラデーション</button>
          <button class="pattern-btn" type="button" data-pattern-btn="tri">トライ</button>
          <button class="pattern-btn" type="button" data-pattern-btn="pulse">パルス</button>
          <button class="pattern-btn" type="button" data-pattern-btn="chase">チェイス</button>
          <button class="pattern-btn" type="button" data-pattern-btn="flicker">フリッカー</button>
          <button class="pattern-btn" type="button" data-pattern-btn="double">二重リム</button>
          <button class="pattern-btn" type="button" data-pattern-btn="under">アンダーグロー</button>
          <button class="pattern-btn" type="button" data-pattern-btn="corner">コーナー</button>
        </div>
      </section>

      <!-- コントロールパネル（各入力がstateに連動） -->
      <div class="panel">
        <div class="field field--wide">
          <div class="field__head">
            <label for="label">ボタンテキスト</label>
          </div>
          <input class="field__text" id="label" type="text" value="BUTTON" maxlength="24" data-key="label" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="width">ボタン幅</label>
            <span class="field__value" data-out="width">320px</span>
          </div>
          <input class="field__slider" id="width" type="range" min="160" max="560" step="4" value="320" data-key="width" data-unit="px" />
        </div>

        <!-- 方向/デュアル/トライ：光源の向き -->
        <div class="field" data-pattern="distant dual tri">
          <div class="field__head">
            <label for="azimuth">光源角度</label>
            <span class="field__value" data-out="azimuth">135°</span>
          </div>
          <input class="field__slider" id="azimuth" type="range" min="0" max="360" step="1" value="135" data-key="azimuth" data-unit="°" data-round="1" />
        </div>

        <div class="field" data-pattern="distant dual tri">
          <div class="field__head">
            <label for="elevation">光源高度</label>
            <span class="field__value" data-out="elevation">46°</span>
          </div>
          <input class="field__slider" id="elevation" type="range" min="0" max="90" step="1" value="46" data-key="elevation" data-unit="°" />
        </div>

        <!-- ポイント：光源位置 -->
        <div class="field" data-pattern="point">
          <div class="field__head">
            <label for="pointX">光源位置X</label>
            <span class="field__value" data-out="pointXPct">50%</span>
          </div>
          <input class="field__slider" id="pointX" type="range" min="0" max="100" step="1" value="50" data-key="pointXPct" data-unit="%" />
        </div>

        <div class="field" data-pattern="point">
          <div class="field__head">
            <label for="pointY">光源位置Y</label>
            <span class="field__value" data-out="pointYPct">0%</span>
          </div>
          <input class="field__slider" id="pointY" type="range" min="0" max="100" step="1" value="0" data-key="pointYPct" data-unit="%" />
        </div>

        <!-- ポイント/ビームグロー：光の広がり -->
        <div class="field" data-pattern="point beamglow">
          <div class="field__head">
            <label for="pointZ">光の広がり</label>
            <span class="field__value" data-out="pointZ">14</span>
          </div>
          <input class="field__slider" id="pointZ" type="range" min="1" max="100" step="1" value="14" data-key="pointZ" />
        </div>

        <!-- アークシャイン/ビームグロー：周回位置 -->
        <div class="field" data-pattern="arcshine beamglow">
          <div class="field__head">
            <label for="orbit">周回角度</label>
            <span class="field__value" data-out="orbitAngle">90°</span>
          </div>
          <input class="field__slider" id="orbit" type="range" min="0" max="360" step="1" value="90" data-key="orbitAngle" data-unit="°" data-round="1" />
        </div>

        <!-- アークシャイン：弧の長さ -->
        <div class="field" data-pattern="arcshine">
          <div class="field__head">
            <label for="arcLen">弧の長さ</label>
            <span class="field__value" data-out="arcLen">22%</span>
          </div>
          <input class="field__slider" id="arcLen" type="range" min="5" max="60" step="1" value="22" data-key="arcLen" data-unit="%" />
        </div>

        <!-- グロスシャイン：艶の角度・幅 -->
        <div class="field" data-pattern="glossshine">
          <div class="field__head">
            <label for="glossAngle">艶の角度</label>
            <span class="field__value" data-out="glossAngle">35°</span>
          </div>
          <input class="field__slider" id="glossAngle" type="range" min="0" max="360" step="1" value="35" data-key="glossAngle" data-unit="°" data-round="1" />
        </div>

        <div class="field" data-pattern="glossshine">
          <div class="field__head">
            <label for="glossWidth">艶の幅</label>
            <span class="field__value" data-out="glossWidth">12</span>
          </div>
          <input class="field__slider" id="glossWidth" type="range" min="4" max="40" step="1" value="12" data-key="glossWidth" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="thickness">リムの太さ</label>
            <span class="field__value" data-out="thickness">14</span>
          </div>
          <input class="field__slider" id="thickness" type="range" min="1" max="40" step="1" value="14" data-key="thickness" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="radius">角丸</label>
            <span class="field__value" data-out="radius">46</span>
          </div>
          <input class="field__slider" id="radius" type="range" min="0" max="46" step="1" value="46" data-key="radius" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="blur">滲み（ぼかし）</label>
            <span class="field__value" data-out="blur">3</span>
          </div>
          <input class="field__slider" id="blur" type="range" min="0" max="15" step="0.5" value="3" data-key="blur" />
        </div>

        <!-- specular系（方向/デュアル/トライ。ポイント=グラデ方式・ネオン系=光源なしは対象外）-->
        <div class="field" data-pattern="distant dual tri">
          <div class="field__head">
            <label for="surface">立体感</label>
            <span class="field__value" data-out="surfaceScale">8</span>
          </div>
          <input class="field__slider" id="surface" type="range" min="0" max="30" step="1" value="8" data-key="surfaceScale" />
        </div>

        <div class="field" data-pattern="distant dual tri">
          <div class="field__head">
            <label for="exponent">光の鋭さ</label>
            <span class="field__value" data-out="exponent">70</span>
          </div>
          <input class="field__slider" id="exponent" type="range" min="1" max="120" step="1" value="70" data-key="exponent" />
        </div>

        <div class="field" data-pattern="distant dual tri">
          <div class="field__head">
            <label for="constant">光の強さ</label>
            <span class="field__value" data-out="constant">1.2</span>
          </div>
          <input class="field__slider" id="constant" type="range" min="0" max="3" step="0.1" value="1.2" data-key="constant" />
        </div>

        <!-- リムの色（方向/ポイント/コーナー/チェイス/アーク/ビーム/グロス＋二重リムの外側） -->
        <div class="field" data-pattern="distant point corner chase double arcshine beamglow glossshine">
          <div class="field__head">
            <label for="color">リムの色</label>
          </div>
          <input class="field__color" id="color" type="color" value="#ffffff" data-key="lightColor" />
        </div>

        <!-- グロー色（ネオン/パルス/フリッカー/アンダーグロー＋二重リムの内側） -->
        <div class="field" data-pattern="neon pulse flicker under double">
          <div class="field__head">
            <label for="glowColor">グロー色</label>
          </div>
          <input class="field__color" id="glowColor" type="color" value="#00ffaa" data-key="glowColor" />
        </div>

        <!-- グロー強度（ネオン/パルス/フリッカー/アンダーグロー） -->
        <div class="field" data-pattern="neon pulse flicker under corner">
          <div class="field__head">
            <label for="glowIntensity">グロー強度</label>
            <span class="field__value" data-out="glowIntensity">0.3</span>
          </div>
          <input class="field__slider" id="glowIntensity" type="range" min="0" max="1" step="0.05" value="0.3" data-key="glowIntensity" />
        </div>

        <!-- デュアル/グラデ/トライ：色 -->
        <div class="field" data-pattern="dual gradient tri">
          <div class="field__head">
            <label for="leftColor">左の色</label>
          </div>
          <input class="field__color" id="leftColor" type="color" value="#22d3ee" data-key="leftColor" />
        </div>

        <div class="field" data-pattern="dual gradient tri">
          <div class="field__head">
            <label for="rightColor">右の色</label>
          </div>
          <input class="field__color" id="rightColor" type="color" value="#f472b6" data-key="rightColor" />
        </div>

        <!-- トライ：3色目 -->
        <div class="field" data-pattern="tri">
          <div class="field__head">
            <label for="thirdColor">3つ目の色</label>
          </div>
          <input class="field__color" id="thirdColor" type="color" value="#a78bfa" data-key="thirdColor" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="fillColor">ボタンの色</label>
          </div>
          <input class="field__color" id="fillColor" type="color" value="#11141b" data-key="fillColor" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="fillOpacity">ボタンの濃さ</label>
            <span class="field__value" data-out="fillOpacity">1</span>
          </div>
          <input class="field__slider" id="fillOpacity" type="range" min="0" max="1" step="0.05" value="1" data-key="fillOpacity" />
        </div>

        <div class="field">
          <div class="field__head">
            <label for="speed">回転速度</label>
            <span class="field__value" data-out="speed">1</span>
          </div>
          <input class="field__slider" id="speed" type="range" min="0.1" max="4" step="0.1" value="1" data-key="speed" />
        </div>

        <div class="panel__actions">
          <button class="btn" id="spin" type="button" aria-pressed="false">自動回転：OFF</button>
          <button class="btn" id="reset" type="button">リセット</button>
        </div>
      </div>

      <!-- 生成コード出力（各設定値に連動して更新される貼り付け用コード） -->
      <div class="output">
        <div class="output__col">
          <div class="output__head">
            <h2>HTML</h2>
            <button class="btn" id="copyHtml" type="button">HTMLをコピー</button>
          </div>
          <textarea class="output__code" id="outHtml" readonly spellcheck="false"></textarea>
        </div>
        <div class="output__col">
          <div class="output__head">
            <h2>CSS</h2>
            <button class="btn" id="copyCss" type="button">CSSをコピー</button>
          </div>
          <textarea class="output__code" id="outCss" readonly spellcheck="false"></textarea>
        </div>
      </div>
    </main>
