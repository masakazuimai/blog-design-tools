<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #fafafa; color: #0a0a0a; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; padding: 0 72px; gap: 56px; }
  .left { flex: 1; }
  .badge { display: inline-block; border: 2px solid #d4d4d4; border-radius: 40px; padding: 6px 22px; font-size: 26px; font-weight: 700; color: #4d4d4d; margin-bottom: 28px; background: #fff; }
  h1 { font-size: 84px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.15; }
  p { margin-top: 24px; font-size: 28px; color: #4d4d4d; line-height: 1.55; }
  .site { margin-top: 32px; font-family: 'Geist Mono', monospace; font-size: 24px; color: #737373; }
  /* 右側のワイヤーフレーム見本 */
  .wf { width: 420px; height: 500px; background: #fff; border: 2px solid #d4d4d4; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .bar { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 2px dashed #ddd; }
  .mark { width: 22px; height: 22px; border: 3px solid #555; border-radius: 5px; }
  .line { height: 10px; border-radius: 5px; background: #d4d4d4; }
  .btn { margin-left: auto; width: 70px; height: 26px; border-radius: 5px; background: #444; }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center; padding-bottom: 14px; border-bottom: 2px dashed #ddd; }
  .stack { display: grid; gap: 9px; }
  .img {
    height: 120px; border: 3px solid #b5b5b5; border-radius: 8px;
    background:
      linear-gradient(to top right, transparent calc(50% - 1.5px), #cfcfcf calc(50% - 1.5px), #cfcfcf calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(to bottom right, transparent calc(50% - 1.5px), #cfcfcf calc(50% - 1.5px), #cfcfcf calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      #efefef;
  }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { height: 120px; border: 3px solid #b5b5b5; border-radius: 8px; padding: 12px; display: grid; gap: 8px; align-content: start; }
  .icon { width: 28px; height: 28px; border: 3px solid #999; border-radius: 6px; background: #f4f4f4; }
  .foot { margin-top: auto; height: 40px; border-radius: 8px; background: #f2f2f2; }
</style>
</head>
<body>
  <div class="left">
    <span class="badge">Free · No sign-up</span>
    <h1>Wireframe<br>Patterns</h1>
    <p>64 website sections as wireframes.<br>Copy the HTML/CSS or build a full page.</p>
    <div class="site">CodeQuest.work</div>
  </div>
  <div class="wf">
    <div class="bar"><span class="mark"></span><span class="line" style="width: 80px"></span><span class="btn"></span></div>
    <div class="hero">
      <div class="stack"><span class="line" style="height: 16px; background: #555"></span><span class="line" style="height: 16px; width: 70%; background: #555"></span><span class="line"></span><span class="line" style="width: 80%"></span><span class="btn" style="margin: 6px 0 0; width: 90px"></span></div>
      <div class="img"></div>
    </div>
    <div class="cards">
      <div class="card"><span class="icon"></span><span class="line"></span><span class="line" style="width: 70%"></span></div>
      <div class="card"><span class="icon"></span><span class="line"></span><span class="line" style="width: 70%"></span></div>
      <div class="card"><span class="icon"></span><span class="line"></span><span class="line" style="width: 70%"></span></div>
    </div>
    <div class="foot"></div>
  </div>
</body>
</html>
