    <script>
      const $ = (id) => document.getElementById(id);

      const state = {
        title: "",
        description: "",
        imageUrl: "",
        imageBlobUrl: "",
        imageWidth: 0,
        imageHeight: 0,
        url: "",
        siteName: "",
        type: "website",
        twitterCard: "summary_large_image",
        platform: "twitter",
      };

      const inputs = {
        title: $("ogTitle"),
        description: $("ogDescription"),
        image: $("ogImage"),
        url: $("ogUrl"),
        siteName: $("ogSiteName"),
        type: $("ogType"),
        twitterCard: $("twitterCard"),
        imageFile: $("imageFile"),
      };

      // サイドバータブ切り替え
      document.querySelectorAll(".sidebar-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".sidebar-tab").forEach((t) => t.classList.remove("active"));
          document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
          tab.classList.add("active");
          $(tab.dataset.panel).classList.add("active");
        });
      });

      // URL入力でEnterキー対応
      $("fetchUrl").addEventListener("keydown", (e) => {
        if (e.key === "Enter") fetchOgp();
      });

      // OGP取得
      function fetchWithTimeout(url, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
      }

      async function fetchViaMicrolink(url) {
        const apiUrl = "https://api.microlink.io/?url=" + encodeURIComponent(url);
        const res = await fetchWithTimeout(apiUrl, 10000);
        if (!res.ok) throw new Error("API応答エラー");
        const json = await res.json();
        if (json.status !== "success" || !json.data) throw new Error("データ取得失敗");

        const d = json.data;
        return {
          title: d.title || "",
          description: d.description || "",
          image: d.image && d.image.url ? d.image.url : "",
          url: d.url || url,
          siteName: d.publisher || "",
          type: "website",
          twitterCard: "summary_large_image",
        };
      }

      async function fetchViaJsonlink(url) {
        const apiUrl = "https://jsonlink.io/api/extract?url=" + encodeURIComponent(url);
        const res = await fetchWithTimeout(apiUrl, 10000);
        if (!res.ok) throw new Error("jsonlink API失敗");
        const d = await res.json();

        return {
          title: d.title || "",
          description: d.description || "",
          image: d.images && d.images.length > 0 ? d.images[0] : "",
          url: d.url || url,
          siteName: d.domain || "",
          type: "website",
          twitterCard: "summary_large_image",
        };
      }

      async function fetchViaProxy(url) {
        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(url);
        const res = await fetchWithTimeout(proxyUrl, 8000);
        if (!res.ok) throw new Error("allorigins失敗");
        const j = await res.json();
        if (!j.contents) throw new Error("コンテンツ取得失敗");

        const parser = new DOMParser();
        const doc = parser.parseFromString(j.contents, "text/html");
        return parseOgTags(doc, url);
      }

      async function fetchOgp() {
        const url = $("fetchUrl").value.trim();
        if (!url) return;

        const statusEl = $("fetchStatus");
        const btn = $("fetchBtn");
        const tagsEl = $("fetchedTags");

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>取得中';
        statusEl.className = "fetch-status";
        statusEl.className = "fetch-status";
        tagsEl.classList.remove("visible");

        try {
          let ogTags;
          const strategies = [fetchViaMicrolink, fetchViaJsonlink, fetchViaProxy];
          let lastErr;
          for (const fn of strategies) {
            try {
              ogTags = await fn(url);
              break;
            } catch (e) {
              lastErr = e;
            }
          }
          if (!ogTags) throw lastErr || new Error("すべての取得方法が失敗しました");

          applyFetchedOgp(ogTags, url);
          renderFetchedTags(ogTags);

          statusEl.className = "fetch-status success";
          statusEl.textContent = "OGPタグを取得しました";
          tagsEl.classList.add("visible");
        } catch (err) {
          statusEl.className = "fetch-status error";
          statusEl.textContent = "取得に失敗しました: " + err.message;
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>取得';
        }
      }

      function parseOgTags(doc, pageUrl) {
        const get = (selectors) => {
          for (const sel of selectors) {
            const el = doc.querySelector(sel);
            if (el) {
              const val = el.getAttribute("content") || el.getAttribute("value") || "";
              if (val) return val;
            }
          }
          return "";
        };

        const title = get(['meta[property="og:title"]', 'meta[name="og:title"]', 'meta[name="twitter:title"]']) || doc.querySelector("title")?.textContent || "";

        const description = get(['meta[property="og:description"]', 'meta[name="og:description"]', 'meta[name="twitter:description"]', 'meta[name="description"]']);

        let image = get(['meta[property="og:image"]', 'meta[name="og:image"]', 'meta[name="twitter:image"]', 'meta[name="twitter:image:src"]']);

        if (image && !image.startsWith("http")) {
          try {
            image = new URL(image, pageUrl).href;
          } catch {
            /* そのまま */
          }
        }

        const ogUrl = get(['meta[property="og:url"]', 'meta[name="og:url"]']) || pageUrl;

        const siteName = get(['meta[property="og:site_name"]', 'meta[name="og:site_name"]']);

        const type = get(['meta[property="og:type"]', 'meta[name="og:type"]']) || "website";

        const twitterCard = get(['meta[name="twitter:card"]', 'meta[property="twitter:card"]']) || "summary_large_image";

        return { title, description, image, url: ogUrl, siteName, type, twitterCard };
      }

      function applyFetchedOgp(tags, fetchedUrl) {
        state.title = tags.title;
        state.description = tags.description;
        state.imageUrl = tags.image;
        state.imageBlobUrl = "";
        state.imageWidth = 0;
        state.imageHeight = 0;
        state.url = tags.url || fetchedUrl;
        state.siteName = tags.siteName;
        state.type = tags.type;
        state.twitterCard = tags.twitterCard;

        if (tags.image) {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            state.imageWidth = img.naturalWidth;
            state.imageHeight = img.naturalHeight;
            updateAll();
          };
          img.src = tags.image;
        }

        updateAll();
      }

      function renderFetchedTags(tags) {
        const items = [
          { key: "og:title", value: tags.title },
          { key: "og:description", value: tags.description },
          { key: "og:image", value: tags.image },
          { key: "og:url", value: tags.url },
          { key: "og:site_name", value: tags.siteName },
          { key: "og:type", value: tags.type },
          { key: "twitter:card", value: tags.twitterCard },
        ];

        $("fetchedTags").innerHTML = items
          .map((item) => {
            const val = item.value ? escapeHtml(item.value) : '<span class="missing">未設定</span>';
            return `<div class="fetched-tag-item">
          <span class="fetched-tag-key">${escapeHtml(item.key)}</span>
          <span class="fetched-tag-value">${val}</span>
        </div>`;
          })
          .join("");
      }

      function extractDomain(url) {
        try {
          return new URL(url).hostname;
        } catch {
          return url || "example.com";
        }
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function getImageSrc() {
        return state.imageBlobUrl || state.imageUrl;
      }

      function getImageHtml(placeholderText) {
        const src = getImageSrc();
        if (src) {
          return `<img src="${escapeHtml(src)}" alt="OG Image" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="placeholder" style="display:none">${placeholderText}</span>`;
        }
        return `<span class="placeholder">${placeholderText}</span>`;
      }

      function renderPreview() {
        const container = $("previewContainer");
        const domain = extractDomain(state.url);
        const title = state.title || "ページタイトル";
        const desc = state.description || "ページの説明文がここに表示されます";
        const siteName = state.siteName || domain;
        const imgPlaceholder = "画像未設定";

        switch (state.platform) {
          case "twitter":
            if (state.twitterCard === "summary") {
              container.innerHTML = `
              <div class="preview-twitter-summary">
                <div class="tw-image">${getImageHtml(imgPlaceholder)}</div>
                <div class="tw-body">
                  <div class="tw-domain">${escapeHtml(domain)}</div>
                  <div class="tw-title">${escapeHtml(title)}</div>
                  <div class="tw-desc">${escapeHtml(desc)}</div>
                </div>
              </div>`;
            } else {
              container.innerHTML = `
              <div class="preview-twitter-large">
                <div class="tw-image">${getImageHtml(imgPlaceholder)}</div>
                <div class="tw-body">
                  <div class="tw-domain">${escapeHtml(domain)}</div>
                  <div class="tw-title">${escapeHtml(title)}</div>
                  <div class="tw-desc">${escapeHtml(desc)}</div>
                </div>
              </div>`;
            }
            break;
          case "facebook":
            container.innerHTML = `
            <div class="preview-facebook">
              <div class="fb-image">${getImageHtml(imgPlaceholder)}</div>
              <div class="fb-body">
                <div class="fb-domain">${escapeHtml(domain)}</div>
                <div class="fb-title">${escapeHtml(title)}</div>
                <div class="fb-desc">${escapeHtml(desc)}</div>
              </div>
            </div>`;
            break;
          case "line":
            container.innerHTML = `
            <div class="preview-line">
              <div class="line-image">${getImageHtml(imgPlaceholder)}</div>
              <div class="line-body">
                <div class="line-title">${escapeHtml(title)}</div>
                <div class="line-desc">${escapeHtml(desc)}</div>
              </div>
            </div>`;
            break;
          case "hatena":
            container.innerHTML = `
            <div class="preview-hatena">
              <div class="hatena-image">${getImageHtml(imgPlaceholder)}</div>
              <div class="hatena-body">
                <div class="hatena-title">${escapeHtml(title)}</div>
                <div class="hatena-desc">${escapeHtml(desc)}</div>
                <div class="hatena-meta">${escapeHtml(domain)}</div>
              </div>
            </div>`;
            break;
          case "linkedin":
            container.innerHTML = `
            <div class="preview-linkedin">
              <div class="li-image">${getImageHtml(imgPlaceholder)}</div>
              <div class="li-body">
                <div class="li-title">${escapeHtml(title)}</div>
                <div class="li-domain">${escapeHtml(domain)}</div>
              </div>
            </div>`;
            break;
          case "pinterest":
            container.innerHTML = `
            <div class="preview-pinterest">
              <div class="pin-image">${getImageHtml(imgPlaceholder)}</div>
              <div class="pin-body">
                <div class="pin-title">${escapeHtml(title)}</div>
                <div class="pin-domain">${escapeHtml(domain)}</div>
              </div>
            </div>`;
            break;
          case "note":
            container.innerHTML = `
            <div class="preview-note">
              <div class="note-image">${getImageHtml(imgPlaceholder)}</div>
              <div class="note-body">
                <div class="note-title">${escapeHtml(title)}</div>
                <div class="note-desc">${escapeHtml(desc)}</div>
                <div class="note-meta">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="#41c9b4"><path d="M22 2H2v20h14l6-6V2zM13 17v3.5L16.5 17H13zM4 4h16v11H11v6H4V4z"/></svg>
                  ${escapeHtml(domain)}
                </div>
              </div>
            </div>`;
            break;
        }
      }

      function runValidation() {
        const list = $("validationList");
        const checks = [];
        const titleLen = state.title.length;
        const descLen = state.description.length;

        if (titleLen === 0) {
          checks.push({ status: "fail", text: "og:title が未入力です" });
        } else if (titleLen <= 60) {
          checks.push({ status: "pass", text: `og:title（${titleLen}文字）— 60文字以内で最適です` });
        } else {
          checks.push({ status: "warn", text: `og:title（${titleLen}文字）— 60文字を超えると一部のSNSで省略されます` });
        }

        if (descLen === 0) {
          checks.push({ status: "warn", text: "og:description が未入力です" });
        } else if (descLen <= 120) {
          checks.push({ status: "pass", text: `og:description（${descLen}文字）— 120文字以内で最適です` });
        } else {
          checks.push({ status: "warn", text: `og:description（${descLen}文字）— 120文字を超えると省略される場合があります` });
        }

        const hasImage = state.imageUrl || state.imageBlobUrl;
        if (!hasImage) {
          checks.push({ status: "fail", text: "og:image が未設定です — SNSでの表示に画像は必須です" });
        } else if (state.imageWidth > 0 && state.imageHeight > 0) {
          const w = state.imageWidth;
          const h = state.imageHeight;
          const ratio = (w / h).toFixed(2);
          if (w >= 1200 && h >= 630) {
            checks.push({ status: "pass", text: `og:image（${w}×${h}px, 比率 ${ratio}）— 推奨サイズを満たしています` });
          } else if (w >= 600 && h >= 315) {
            checks.push({ status: "warn", text: `og:image（${w}×${h}px）— 推奨は1200×630px以上です` });
          } else {
            checks.push({ status: "fail", text: `og:image（${w}×${h}px）— 小さすぎます。最低600×315px、推奨1200×630pxです` });
          }
        } else {
          checks.push({ status: "pass", text: "og:image が設定されています（URL指定）" });
        }

        if (!state.url) {
          checks.push({ status: "warn", text: "og:url が未設定です — 正規URLの指定を推奨します" });
        } else {
          try {
            new URL(state.url);
            checks.push({ status: "pass", text: "og:url が正しい形式で設定されています" });
          } catch {
            checks.push({ status: "fail", text: "og:url が正しいURL形式ではありません" });
          }
        }

        if (state.siteName) {
          checks.push({ status: "pass", text: "og:site_name が設定されています" });
        }

        const icons = {
          pass: '<svg class="validation-icon" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
          warn: '<svg class="validation-icon" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><path d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
          fail: '<svg class="validation-icon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
        };

        list.innerHTML = checks.map((c) => `<li class="validation-item ${c.status}">${icons[c.status]}${escapeHtml(c.text)}</li>`).join("");
      }

      function generateCode() {
        const lines = [];
        const imageUrlForCode = state.imageUrl || "（画像URLを入力してください）";

        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">property</span>=<span class="val">"og:title"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.title)}"</span> <span class="tag">/&gt;</span>`);
        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">property</span>=<span class="val">"og:description"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.description)}"</span> <span class="tag">/&gt;</span>`);
        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">property</span>=<span class="val">"og:type"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.type)}"</span> <span class="tag">/&gt;</span>`);
        if (state.url) {
          lines.push(`<span class="tag">&lt;meta</span> <span class="attr">property</span>=<span class="val">"og:url"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.url)}"</span> <span class="tag">/&gt;</span>`);
        }
        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">property</span>=<span class="val">"og:image"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(imageUrlForCode)}"</span> <span class="tag">/&gt;</span>`);
        if (state.siteName) {
          lines.push(`<span class="tag">&lt;meta</span> <span class="attr">property</span>=<span class="val">"og:site_name"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.siteName)}"</span> <span class="tag">/&gt;</span>`);
        }
        lines.push("");
        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="val">"twitter:card"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.twitterCard)}"</span> <span class="tag">/&gt;</span>`);
        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="val">"twitter:title"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.title)}"</span> <span class="tag">/&gt;</span>`);
        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="val">"twitter:description"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(state.description)}"</span> <span class="tag">/&gt;</span>`);
        lines.push(`<span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="val">"twitter:image"</span> <span class="attr">content</span>=<span class="val">"${escapeHtml(imageUrlForCode)}"</span> <span class="tag">/&gt;</span>`);

        $("codeOutput").innerHTML = lines.join("\n");
      }

      function getPlainCode() {
        const lines = [];
        const imageUrlForCode = state.imageUrl || "（画像URLを入力してください）";

        lines.push(`<meta property="og:title" content="${state.title}" />`);
        lines.push(`<meta property="og:description" content="${state.description}" />`);
        lines.push(`<meta property="og:type" content="${state.type}" />`);
        if (state.url) {
          lines.push(`<meta property="og:url" content="${state.url}" />`);
        }
        lines.push(`<meta property="og:image" content="${imageUrlForCode}" />`);
        if (state.siteName) {
          lines.push(`<meta property="og:site_name" content="${state.siteName}" />`);
        }
        lines.push("");
        lines.push(`<meta name="twitter:card" content="${state.twitterCard}" />`);
        lines.push(`<meta name="twitter:title" content="${state.title}" />`);
        lines.push(`<meta name="twitter:description" content="${state.description}" />`);
        lines.push(`<meta name="twitter:image" content="${imageUrlForCode}" />`);

        return lines.join("\n");
      }

      function copyCode() {
        const btn = $("copyBtn");
        navigator.clipboard.writeText(getPlainCode()).then(() => {
          btn.classList.add("copied");
          btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>コピー済み';
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>コピー';
          }, 2000);
        });
      }

      function updateCharCount(id, len, max) {
        const el = $(id);
        el.textContent = `${len} / ${max}`;
        el.className = "char-count";
        if (len > max) el.classList.add("over");
        else if (len > max * 0.85) el.classList.add("warn");
      }

      function updateAll() {
        renderPreview();
        runValidation();
        generateCode();
      }

      function handleImageFile(file) {
        if (!file || !file.type.startsWith("image/")) return;
        if (state.imageBlobUrl) URL.revokeObjectURL(state.imageBlobUrl);

        const blobUrl = URL.createObjectURL(file);
        state.imageBlobUrl = blobUrl;

        const img = new Image();
        img.onload = () => {
          state.imageWidth = img.naturalWidth;
          state.imageHeight = img.naturalHeight;
          $("imageThumb").src = blobUrl;
          $("imageInfo").textContent = `${img.naturalWidth} × ${img.naturalHeight}px`;
          $("imagePreviewArea").style.display = "block";
          updateAll();
        };
        img.src = blobUrl;
      }

      function clearImage() {
        if (state.imageBlobUrl) URL.revokeObjectURL(state.imageBlobUrl);
        state.imageBlobUrl = "";
        state.imageWidth = 0;
        state.imageHeight = 0;
        inputs.imageFile.value = "";
        $("imagePreviewArea").style.display = "none";
        updateAll();
      }

      // 手動入力イベント
      inputs.title.addEventListener("input", () => {
        state.title = inputs.title.value;
        updateCharCount("titleCount", state.title.length, 60);
        updateAll();
      });

      inputs.description.addEventListener("input", () => {
        state.description = inputs.description.value;
        updateCharCount("descCount", state.description.length, 120);
        updateAll();
      });

      inputs.image.addEventListener("input", () => {
        state.imageUrl = inputs.image.value;
        if (state.imageUrl && !state.imageBlobUrl) {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            state.imageWidth = img.naturalWidth;
            state.imageHeight = img.naturalHeight;
            $("imageThumb").src = state.imageUrl;
            $("imageInfo").textContent = `${img.naturalWidth} × ${img.naturalHeight}px`;
            $("imagePreviewArea").style.display = "block";
            updateAll();
          };
          img.onerror = () => {
            state.imageWidth = 0;
            state.imageHeight = 0;
            $("imagePreviewArea").style.display = "none";
            updateAll();
          };
          img.src = state.imageUrl;
        } else {
          updateAll();
        }
      });

      inputs.url.addEventListener("input", () => {
        state.url = inputs.url.value;
        updateAll();
      });
      inputs.siteName.addEventListener("input", () => {
        state.siteName = inputs.siteName.value;
        updateAll();
      });
      inputs.type.addEventListener("change", () => {
        state.type = inputs.type.value;
        updateAll();
      });
      inputs.twitterCard.addEventListener("change", () => {
        state.twitterCard = inputs.twitterCard.value;
        updateAll();
      });

      inputs.imageFile.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) handleImageFile(file);
      });

      $("imageClear").addEventListener("click", clearImage);

      const dropZone = $("imageDropZone");
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
      });
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        const file = e.dataTransfer.files[0];
        if (file) handleImageFile(file);
      });

      // プラットフォームタブ
      document.querySelectorAll(".platform-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".platform-tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          state.platform = tab.dataset.platform;
          renderPreview();
        });
      });

      updateAll();
    </script>
  </body>
</html>
