<!doctype html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#fff;font-family:"Noto Sans JP",sans-serif;color:#15181d;display:grid;grid-template-columns:220px 1fr;gap:64px;align-items:center;padding:0 96px;box-sizing:border-box;border-bottom:16px solid #15181d}
.plate{width:200px;height:400px;background:#c4161c;border-radius:4px;display:grid;place-items:center;box-shadow:inset 0 0 0 6px rgba(255,255,255,.18)}
.plate span{color:#fff;writing-mode:vertical-rl;font-size:64px;font-weight:900;letter-spacing:.08em}
h1{margin:0;font-size:76px;line-height:1.18;letter-spacing:-.03em;font-weight:900}
p{margin:28px 0 0;font-size:34px;font-weight:700;color:#4a515e}
.site{margin-top:40px;font-size:28px;font-weight:700}
</style></head>
<body><div class="plate"><span>火気厳禁</span></div>
<div><h1>危険物乙4<br>一問一答</h1><p>法令・物理化学・性質消火<br>4択150問　無料・登録不要</p><div class="site">CodeQuest.work</div></div></body></html>
