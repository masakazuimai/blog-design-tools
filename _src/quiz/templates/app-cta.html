<aside class="app-cta" data-app-cta data-deck-id="{{deck_id}}" data-placement="{{placement}}" aria-labelledby="app-cta-{{placement}}" hidden>
  <div class="app-cta__body">
    <h2 class="app-cta__title" id="app-cta-{{placement}}">続きはスマホのアプリで</h2>
    <ul class="app-cta__points">
      <li>間違えた問題を、忘却曲線に合わせて日をあけて出し直します。</li>
      <li>{{pack}}</li>
    </ul>
    <a class="btn btn--primary app-cta__btn" href="https://codequest.work/app/quizmaker/article" data-app-link>アプリで復習する</a>
  </div>
  <figure class="app-cta__qr">
    <img src="/quiz/assets/qr-app.svg?v={{ver}}" width="148" height="148" alt="アプリの案内ページを開くQRコード" loading="lazy">
    <figcaption>スマホのカメラで読み取ると、アプリの案内が開きます。</figcaption>
  </figure>
</aside>
