      <li class="deck" data-deck-id="{{deck_id}}" data-count="{{count}}">
        <a class="deck__link" href="{{href}}">
          <span class="deck__head">
            <span class="deck__subject">{{subject}}</span>
            <span class="deck__count">{{count}}問<span class="deck__exam">本番は{{exam}}問</span></span>
          </span>
          <span class="deck__lead">{{lead}}</span>
          <span class="deck__progress" data-progress>
            <span class="meter" aria-hidden="true"><span class="meter__fill" data-meter></span></span>
            <span class="deck__status" data-status>まだ解いていません</span>
          </span>
        </a>
      </li>
