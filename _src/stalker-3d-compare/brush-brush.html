<!doctype html><body style="margin:0;background:#fff"><canvas id=c width=1100 height=460></canvas><script>
const mc=document.getElementById("c").getContext("2d");mc.fillStyle="#000";mc.strokeStyle="#000";const R=90;let mx=0,my=0;
  let lx = -999, ly = -999, lastW = 0, tick = 0, travel = 0, idle = 0, lnx = 0, lny = 1;
  const hairs = [
    ...Array.from({ length: 40 }, (_, i) => ({
      o: (i / 39 - 0.5) * 1.1 + (Math.random() - 0.5) * 0.03,
      w: 1.4 + Math.random() * 1.8,
      a: 0.8 + Math.random() * 0.2,
      dry: Math.random(),
      ph: 0,
      wob: 0,
    })),
    ...Array.from({ length: 34 }, () => ({
      o: (Math.random() - 0.5) * 1.2,
      w: 0.8 + Math.random() * 2.6,
      a: 0.6 + Math.random() * 0.4,
      dry: Math.random(),
      ph: Math.random() * Math.PI * 2,
      wob: 0.03 + Math.random() * 0.07,
    })),
  ];


function circle(cx,cy,r,n){lx=-999;lastW=0;travel=0;for(let i=0;i<=n;i++){const t=i/n*Math.PI*1.85-Math.PI/2;mx=cx+Math.cos(t)*r;my=cy+Math.sin(t)*r;const dist=Math.hypot(mx-lx,my-ly);if(lx<-900){lx=mx;ly=my;continue;}if(dist>2){    const nx1 = -(my - ly) / dist;
    const ny1 = (mx - lx) / dist;
    if (!lastW) {
      lnx = nx1;
      lny = ny1;
    }
    const target = R * 1.3 * (0.85 + 0.15 * Math.max(0, 1 - dist / 60)) * Math.min(1, 0.12 + travel / (R * 2.5));
    const w = lastW ? lastW + (target - lastW) * 0.35 : target;
    const steps = Math.max(1, Math.ceil(dist / 2));
    for (let k = 1; k <= steps; k++) {
      const t = k / steps;
      const x = lx + (mx - lx) * t;
      const y = ly + (my - ly) * t;
      const ww = (lastW || w) + (w - (lastW || w)) * t;
      const ix = lnx + (nx1 - lnx) * t;
      const iy = lny + (ny1 - lny) * t;
      const il = Math.hypot(ix, iy) || 1;
      const nx = ix / il;
      const ny = iy / il;
      travel += dist / steps;
      const ink = Math.max(0, 1 - travel / (R * 25));
      const dry = Math.min(0.65, (1 - ink) * 0.45 + dist / 120);
      mc.globalAlpha = 1;
      const core = ww * 0.28 * (1 - dry * 0.5);
      if (core > 1) {
        mc.beginPath();
        mc.arc(x, y, core, 0, Math.PI * 2);
        mc.fill();
      }
      hairs.forEach((h) => {
        if (h.dry < (0.4 + dry) * Math.max(0, Math.abs(h.o) - 0.2) * 3) return;
        const o = h.o + Math.sin(travel * 0.015 + h.ph) * h.wob + (Math.random() - 0.5) * 0.03;
        mc.globalAlpha = h.a * (0.8 + Math.random() * 0.2);
        mc.beginPath();
        mc.arc(x + nx * o * ww, y + ny * o * ww, Math.max(0.6, ((h.w * ww * (1.1 - dry * 0.5)) / 40 / 1.4) * (0.85 + Math.random() * 0.3) * Math.max(0.3, 1.35 - Math.abs(o) * 1.9)), 0, Math.PI * 2);
        mc.fill();
      });
    }
    if (dist > 22 && Math.random() < 0.35) {
      mc.globalAlpha = 1;
      for (let j = 0; j < 3; j++) {
        const s = (Math.random() - 0.5) * w * 1.6;
        const back = Math.random() * dist;
        mc.beginPath();
        mc.arc(mx - (mx - lx) * (back / dist) + nx1 * s, my - (my - ly) * (back / dist) + ny1 * s, 1 + Math.random() * 2.5, 0, Math.PI * 2);
        mc.fill();
      }
    }
    mc.globalAlpha = 1;
    lastW = w;
    lnx = nx1;
    lny = ny1;

lx=mx;ly=my;}}


}
