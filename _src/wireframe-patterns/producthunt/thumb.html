<!doctype html>
<!-- Product Huntのサムネイル（240×240）。積み重なったセクションのワイヤーを図案化 -->
<html><head><meta charset="UTF-8"><style>
*{margin:0;box-sizing:border-box}
body{width:240px;height:240px;overflow:hidden;background:#0a0a0a;display:grid;place-items:center}
.page{width:168px;display:grid;gap:8px}
.sec{border:3px solid #fff;border-radius:10px;background:#0a0a0a}
.hd{height:26px;display:flex;align-items:center;gap:6px;padding:0 8px}
.dot{width:10px;height:10px;border:2px solid #fff;border-radius:3px}
.ln{height:5px;border-radius:3px;background:#777}
.hero{height:62px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.img{border:2px solid #777;border-radius:5px;background:
 linear-gradient(to top right,transparent calc(50% - 1px),#777 calc(50% - 1px),#777 calc(50% + 1px),transparent calc(50% + 1px)),
 linear-gradient(to bottom right,transparent calc(50% - 1px),#777 calc(50% - 1px),#777 calc(50% + 1px),transparent calc(50% + 1px))}
.cols{height:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px}
.cols i{border:2px solid #777;border-radius:4px}
</style></head><body>
<div class="page">
  <div class="sec hd"><span class="dot"></span><span class="ln" style="width:40px"></span><span class="ln" style="width:22px;margin-left:auto;background:#fff"></span></div>
  <div class="sec hero"><div style="display:grid;gap:6px;align-content:center"><span class="ln" style="background:#fff"></span><span class="ln" style="width:70%;background:#fff"></span><span class="ln" style="width:85%"></span></div><div class="img"></div></div>
  <div class="sec cols"><i></i><i></i><i></i></div>
</div>
</body></html>
