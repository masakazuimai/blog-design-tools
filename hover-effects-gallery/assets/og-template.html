<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* OG画像テンプレート（1200×630）。ヘッドレスChromeでPNG化する */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #3730a3 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 90px;
        position: relative;
        overflow: hidden;
      }
      .badge {
        display: inline-block;
        align-self: flex-start;
        background: rgba(147, 197, 253, 0.18);
        border: 2px solid rgba(147, 197, 253, 0.5);
        color: #bfdbfe;
        font-size: 30px;
        font-weight: 700;
        padding: 10px 28px;
        border-radius: 999px;
        margin-bottom: 34px;
      }
      h1 {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      h1 .accent { color: #a5b4fc; }
      .sub {
        margin-top: 28px;
        font-size: 34px;
        color: #c7d2fe;
        font-weight: 600;
      }
      .samples {
        position: absolute;
        right: 70px;
        bottom: 54px;
        display: flex;
        gap: 26px;
        align-items: center;
        font-size: 30px;
        font-weight: 700;
      }
      .s1 { color: #fff; border-bottom: 4px solid #a5b4fc; padding-bottom: 6px; }
      .s2 { color: #fff; background: #6366f1; padding: 10px 26px; border-radius: 10px; }
      .s3 { color: #f9a8d4; text-shadow: 0 0 18px #ec4899; }
      .s4 { color: #fff; border: 3px solid #a5b4fc; padding: 8px 24px; border-radius: 999px; }
      .brand {
        position: absolute;
        left: 90px;
        bottom: 54px;
        font-size: 30px;
        color: #93c5fd;
        font-weight: 700;
      }
      .deco {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99,102,241,0.5), transparent 70%);
      }
      .deco1 { width: 500px; height: 500px; right: -140px; top: -200px; }
      .deco2 { width: 380px; height: 380px; left: -120px; bottom: -180px; background: radial-gradient(circle, rgba(236,72,153,0.35), transparent 70%); }
    </style>
  </head>
  <body>
    <div class="deco deco1"></div>
    <div class="deco deco2"></div>
    <div class="badge">コピペOK・JS不要・無料</div>
    <h1>CSSホバーエフェクト<br /><span class="accent">100選</span> ギャラリー</h1>
    <div class="sub">ナビ・テキストリンクのホバーアニメーション</div>
    <div class="samples">
      <span class="s1">Menu</span>
      <span class="s2">Menu</span>
      <span class="s3">Menu</span>
      <span class="s4">Menu</span>
    </div>
    <div class="brand">CodeQuest.work</div>
  </body>
</html>
