<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <!-- warm paper -->
  <rect width="1200" height="630" fill="#f4efe3"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d3c9b1" stroke-width="2"/>

  <!-- seal -->
  <g transform="translate(96,104)">
    <circle r="26" fill="none" stroke="#b14730" stroke-width="3"/>
    <circle r="20" fill="#b14730"/>
  </g>
  <text x="140" y="112" font-size="22" letter-spacing="6" fill="#a79d8a">CODEQUEST　COLOR DICTIONARY</text>

  <!-- title -->
  <text x="92" y="258" font-size="104" font-weight="600" fill="#23201a" letter-spacing="-3">Color <tspan fill="#b14730">Dictionary</tspan></text>
  <text x="98" y="326" font-size="33" fill="#6f6757">Japanese traditional colors × CSS named colors</text>
  <text x="98" y="374" font-size="29" fill="#8a8275">Look up the origin, meaning and code of every color.</text>

  <!-- specimen strip -->
  <g transform="translate(92,452)">
    <g>
      <rect width="120" height="92" rx="4" fill="#b7282e"/>
      <text x="60" y="118" font-size="20" fill="#6f6757" text-anchor="middle">akane</text>
    </g>
    <g transform="translate(136,0)">
      <rect width="120" height="92" rx="4" fill="#f8b500"/>
      <text x="60" y="118" font-size="18" fill="#6f6757" text-anchor="middle">yamabuki</text>
    </g>
    <g transform="translate(272,0)">
      <rect width="120" height="92" rx="4" fill="#aacf53"/>
      <text x="60" y="118" font-size="20" fill="#6f6757" text-anchor="middle">moegi</text>
    </g>
    <g transform="translate(408,0)">
      <rect width="120" height="92" rx="4" fill="#00a3af"/>
      <text x="60" y="118" font-size="20" fill="#6f6757" text-anchor="middle">asagi</text>
    </g>
    <g transform="translate(544,0)">
      <rect width="120" height="92" rx="4" fill="#745399"/>
      <text x="60" y="118" font-size="18" fill="#6f6757" text-anchor="middle">edomurasaki</text>
    </g>
    <g transform="translate(680,0)">
      <rect width="120" height="92" rx="4" fill="#dc143c"/>
      <text x="60" y="118" font-size="20" fill="#6f6757" text-anchor="middle">crimson</text>
    </g>
    <g transform="translate(816,0)">
      <rect width="120" height="92" rx="4" fill="#008080"/>
      <text x="60" y="118" font-size="20" fill="#6f6757" text-anchor="middle">teal</text>
    </g>
    <g transform="translate(952,0)">
      <rect width="120" height="92" rx="4" fill="#ffd700"/>
      <text x="60" y="118" font-size="20" fill="#6f6757" text-anchor="middle">gold</text>
    </g>
  </g>
</svg>
