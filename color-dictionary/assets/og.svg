<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <!-- 和紙ベース -->
  <rect width="1200" height="630" fill="#f4efe3"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d3c9b1" stroke-width="2"/>

  <!-- 落款（朱印） -->
  <g transform="translate(96,104)">
    <circle r="26" fill="none" stroke="#b14730" stroke-width="3"/>
    <circle r="20" fill="#b14730"/>
  </g>
  <text x="140" y="112" font-size="22" letter-spacing="6" fill="#a79d8a">CODEQUEST　色の辞書</text>

  <!-- タイトル -->
  <text x="92" y="270" font-size="118" font-weight="600" fill="#23201a" letter-spacing="-2">色の<tspan fill="#b14730">辞書</tspan></text>
  <text x="98" y="338" font-size="34" fill="#6f6757">日本の伝統色 × CSSの名前付き色</text>
  <text x="98" y="386" font-size="30" fill="#8a8275">名前の由来・色の意味・カラーコードを、ひける。</text>

  <!-- 色見本帯 -->
  <g transform="translate(92,452)">
    <g>
      <rect width="120" height="92" rx="4" fill="#b7282e"/>
      <text x="60" y="118" font-size="22" fill="#6f6757" text-anchor="middle">茜色</text>
    </g>
    <g transform="translate(136,0)">
      <rect width="120" height="92" rx="4" fill="#f8b500"/>
      <text x="60" y="118" font-size="22" fill="#6f6757" text-anchor="middle">山吹色</text>
    </g>
    <g transform="translate(272,0)">
      <rect width="120" height="92" rx="4" fill="#aacf53"/>
      <text x="60" y="118" font-size="22" fill="#6f6757" text-anchor="middle">萌黄</text>
    </g>
    <g transform="translate(408,0)">
      <rect width="120" height="92" rx="4" fill="#00a3af"/>
      <text x="60" y="118" font-size="22" fill="#6f6757" text-anchor="middle">浅葱色</text>
    </g>
    <g transform="translate(544,0)">
      <rect width="120" height="92" rx="4" fill="#745399"/>
      <text x="60" y="118" font-size="22" fill="#6f6757" text-anchor="middle">江戸紫</text>
    </g>
    <g transform="translate(680,0)">
      <rect width="120" height="92" rx="4" fill="#dc143c"/>
      <text x="60" y="118" font-size="20" fill="#6f6757" text-anchor="middle">crimson</text>
    </g>
    <g transform="translate(816,0)">
      <rect width="120" height="92" rx="4" fill="#008080"/>
      <text x="60" y="118" font-size="22" fill="#6f6757" text-anchor="middle">teal</text>
    </g>
    <g transform="translate(952,0)">
      <rect width="120" height="92" rx="4" fill="#ffd700"/>
      <text x="60" y="118" font-size="22" fill="#6f6757" text-anchor="middle">gold</text>
    </g>
  </g>
</svg>
